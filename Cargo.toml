[package]
name = "gear_os"
version = "0.1.0"
edition = "2024"
authors = ["crazywizard"]

[dependencies]
bootloader = "0.9"
volatile = "0.2.6"
spin = "0.5.2"
x86_64 = "0.14.2"
uart_16550 = "0.2.0"
pic8259 = "0.10.1"

[profile.dev]
#panic = "abort"

[profile.release]
#panic = "abort"

[dependencies.lazy_static]
version = "1.0"
features = ["spin_no_std"]

[package.metadata.bootimage]
test-args = ["-device", "isa-debug-exit,iobase=0xf4,iosize=0x04", "-serial", "stdio", "-display", "none"]
test-success-exit-code = 33
test-timeout = 300

[[test]]
name = "basic_boot"
harness = false

[[test]]
name = "idt_exceptions_present"
harness = false

[[test]]
name = "should_panic"
harness = false

[[test]]
name = "stack_overflow"
harness = false

[[test]]
name = "page_fault_panics"
harness = false

[[test]]
name = "pic_masks_and_irqs"
harness = false

[[test]]
name = "exception_report_format"
harness = false

[[test]]
name = "timer_ticks_progress"
harness = false
